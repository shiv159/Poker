name: build

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  container-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -DskipTests package
        working-directory: backend
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: poker-night-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: poker-night-frontend:ci

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - name: Start backend
        shell: bash
        run: nohup mvn spring-boot:run > /tmp/poker-backend.log 2>&1 &
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
      - name: Start frontend
        shell: bash
        run: nohup npm start -- --host 0.0.0.0 > /tmp/poker-frontend.log 2>&1 &
        working-directory: frontend
      - name: Wait for servers
        shell: bash
        run: |
          for i in {1..60}; do curl --fail --silent http://localhost:8080/api/tables/health >/dev/null 2>&1 && curl --fail --silent http://localhost:4200/ >/dev/null 2>&1 && break; sleep 2; done
          curl --fail http://localhost:4200/
      - run: npm run e2e:smoke
        working-directory: frontend
