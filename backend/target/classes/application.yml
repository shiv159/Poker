server:
  port: 8080
spring:
  application:
    name: poker-night
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 2s
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8088}
  websocket-allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8088}
  action-timeout-seconds: 30
logging:
  level:
    com.pokernight: INFO
