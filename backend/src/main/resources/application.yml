server:
  port: 8080
spring:
  application:
    name: poker-night
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 2s
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
  action-timeout-seconds: 30
logging:
  level:
    com.pokernight: INFO
